[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-live2d-studio"
version = "0.1.0"
description = "Local, project-driven 2D to Live2D production workbench"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "Pillow>=11,<13", "numpy>=2,<3", "psd-tools>=1.10,<2"]

[project.scripts]
astra-studio = "astra_studio.cli:main"

[tool.setuptools.packages.find]
include = ["astra_studio*"]

[tool.setuptools.package-data]
astra_studio = ["web/*"]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "playwright>=1.50,<2"]
